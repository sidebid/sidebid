[workspace]
members = ["programs/*"]
resolver = "2"

# solana-verify picks its Docker image (solanafoundation/solana-verifiable-build)
# from this version. It matches the local Agave CLI the tests were built with.
[workspace.metadata.cli]
solana = "4.1.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
